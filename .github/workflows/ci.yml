# CI-конвейер шаблона: lint → mypy → tests → security-сканы → build + trivy.
# Красный CI = не мержим.
# Сторонние actions закреплены по commit SHA (тег можно перезаписать — так
# крадут секреты CI); комментарий рядом — версия, которой соответствует SHA.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  UV_VERSION: "0.11.26"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync
      - name: Лок-файл синхронизирован с pyproject (V8)
        run: uv lock --check
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app modules tools shared migrations tests
      - name: Контракты импортов (слои app → modules → core → shared)
        run: uv run lint-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync
      - name: "Тесты с покрытием (testcontainers: Postgres 16 + Redis 7)"
        run: >
          uv run pytest
          --cov=app --cov=core --cov=shared --cov=modules --cov=tools
          --cov-report=term-missing
          --cov-fail-under=85

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: pip-audit (известные CVE зависимостей)
        run: |
          uv export --format requirements-txt --no-emit-project -o requirements-ci.txt
          uvx pip-audit@2.10.1 -r requirements-ci.txt
      - name: bandit (SAST; блокируют medium+, low — в отчёте)
        run: >
          uvx bandit@1.9.4 -c pyproject.toml --severity-level medium
          -r app core modules shared migrations tools

  gitleaks:
    # Секрет-сканер (решение ОВ-30): утечка секрета в шаблоне тиражируется
    # по всем клиентским проектам — главный самострел.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Сборка образа
        run: docker build -t backend-core:${{ github.sha }} .
      - name: trivy-скан образа (CRITICAL/HIGH блокируют)
        # v0.36.0: 0.31.0–0.34.0 уязвимы (GHSA-9p44-j4g5-cfx5).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: backend-core:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
