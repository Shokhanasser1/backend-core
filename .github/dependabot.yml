# Еженедельные PR с обновлениями зависимостей. Мелкие (minor/patch) сгруппированы,
# чтобы не плодить PR; мажорные приходят по одному — их читают отдельно (CHANGELOG
# апстрима). Каждый PR проходит обычный CI (lint, тесты, pip-audit).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
